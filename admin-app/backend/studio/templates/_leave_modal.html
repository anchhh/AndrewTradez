<div id="name-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <button id="modal-close-btn" class="modal-close" title="Keep editing">&times;</button>
    <h3 id="modal-title">Save your progress</h3>
    <p class="hint">Give this project a name, or we'll use the listing address/post title if we found one.</p>
    <input id="modal-name-input" type="text" placeholder="e.g. 123 Main St" />
    <div id="modal-status" class="status"></div>
    <div class="modal-actions">
      <button id="modal-discard-btn" class="btn-secondary">Don't Save</button>
      <button id="modal-draft-btn" class="btn-secondary">Save as Draft</button>
      <button id="modal-save-btn">Save</button>
    </div>
  </div>
</div>
