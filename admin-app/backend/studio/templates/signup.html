<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estly Studio — Sign Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23efe8dd'/%3E%3Ctext x='16' y='42' font-family='Arial' font-weight='800' font-size='30' fill='%2317130f'%3Ee%3C/text%3E%3Crect x='42' y='16' width='7' height='16' fill='%23ef5a2b' transform='skewX(-18)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('studio.static', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="brand brand-lg">
      <span class="logo-text">estly<span class="logo-accent"></span></span>
      <span class="logo-sub">Studio</span>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">Create your account</h1>
      <p class="sub">One account, all your listings and projects in one place.</p>
      {% if error %}<div class="status error">{{ error }}</div>{% endif %}
      {% if google_oauth_enabled %}
      <a href="{{ url_for('studio.auth_google', next=request.args.get('next')) }}" class="google-btn">
        <svg viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </a>
      <div class="auth-divider"><span>or</span></div>
      {% endif %}
      <form method="post" class="auth-form">
        <label class="auth-label">Email</label>
        <input type="email" name="email" autocomplete="email" required autofocus>
        <label class="auth-label">Password</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="6">
        <label class="auth-label">Confirm password</label>
        <input type="password" name="confirm" autocomplete="new-password" required minlength="6">
        <button type="submit" class="cta-btn auth-submit">Sign up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="{{ url_for('studio.login', next=request.args.get('next')) }}">Log in</a></p>
    </div>
  </div>
</body>
</html>
