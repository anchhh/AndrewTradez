<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estly Studio — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23efe8dd'/%3E%3Ctext x='16' y='42' font-family='Arial' font-weight='800' font-size='30' fill='%2317130f'%3Ee%3C/text%3E%3Crect x='42' y='16' width='7' height='16' fill='%23ef5a2b' transform='skewX(-18)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('studio.static', filename='style.css') }}">
</head>
<body>
{% include "_nav.html" %}
<div class="wrap lm-wrap">
  <h1 class="page-title">Welcome, {{ display_name or 'back' }}</h1>

  <div class="lm-stats">
    <div class="lm-stat">
      <div class="lm-stat-label">Active projects</div>
      <div class="lm-stat-value" id="stat-active-projects">—</div>
    </div>
    <div class="lm-stat">
      <div class="lm-stat-label">Projects to do</div>
      <div class="lm-stat-value" id="stat-projects-todo">—</div>
    </div>
    <div class="lm-stat">
      <div class="lm-stat-label">Hot leads</div>
      <div class="lm-stat-value" id="stat-hot-leads">—</div>
    </div>
    <div class="lm-stat">
      <div class="lm-stat-label">Revenue</div>
      <div class="lm-stat-value lm-stat-placeholder">$XXX,XXX</div>
    </div>
  </div>

  <div class="lm-layout">
    <section class="lm-projects">
      <div class="lm-section-header">
        <h2>Projects</h2>
        <div class="lm-section-actions">
          <a href="/studio/leads" class="btn-secondary btn-tiny">Lead Manager</a>
          <a href="/studio/create" class="cta-btn cta-btn-sm">+ New Project</a>
        </div>
      </div>
      <div id="leads-status" class="status"></div>

      <div id="lm-groups"></div>
      <p id="lm-empty" class="empty-note hidden">No qualified leads yet — mark some as qualified in the Lead Manager.</p>
    </section>

    <aside class="lm-sidebar">
      <h2>Daily checklist</h2>
      <div id="daily-checklist" class="daily-checklist"></div>
    </aside>
  </div>
</div>
<script src="{{ url_for('studio.static', filename='dashboard.js') }}"></script>
</body>
</html>
