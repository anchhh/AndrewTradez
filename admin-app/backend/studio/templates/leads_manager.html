<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>estly Studio — Lead Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23efe8dd'/%3E%3Ctext x='16' y='42' font-family='Arial' font-weight='800' font-size='30' fill='%2317130f'%3Ee%3C/text%3E%3Crect x='42' y='16' width='7' height='16' fill='%23ef5a2b' transform='skewX(-18)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('studio.static', filename='style.css') }}">

<body>
{% include "_nav.html" %}
<div class="wrap wrap-wide">
  <header class="page-header">
    <div>
      <h1 class="page-title">Lead Manager</h1>
      <p class="sub">Every lead lands here first. Sort, contact, and mark the good ones qualified to send them to the Dashboard.</p>
    </div>
  </header>

  <div id="leads-status" class="status"></div>

  <div class="table-wrap">
    <table id="lmg-table" class="lm-table hidden">
      <thead>
        <tr>
          <th></th>
          <th>Lead</th>
          <th>Status</th>
          <th>Source</th>
          <th>Checklist</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="lmg-tbody"></tbody>
    </table>
  </div>
  <p id="lmg-empty" class="empty-note hidden">No leads yet — capture one with the Chrome extension.</p>
</div>
<script src="{{ url_for('studio.static', filename='leads_manager.js') }}"></script>
</body>
</html>
