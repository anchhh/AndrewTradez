<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERCURY | Elite Trading Mentorship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            syncopate: ['Syncopate', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            dark: '#050505',
            chrome: '#e2e2e2',
            accent: '#00f0ff',
          },
          animation: {
            'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050505;
      color: #e2e2e2;
      cursor: crosshair;
    }
    .liquid-filter {
      filter: url(#liquid);
    }
    @keyframes flow {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 40% 60% 70% 30%; }
      100% { transform: translate(100px, 50px) rotate(90deg) scale(1.2); border-radius: 60% 40% 30% 70%; }
    }
    .blob {
      animation: flow 20s infinite alternate ease-in-out;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Hide scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<script type="importmap">
{

    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
